name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldRotation90-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
